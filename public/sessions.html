    <a href="supplier.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7h13v10H3z"/><path d="M16 10h3l2 2v5h-5z"/><path d="M7 17a2 2 0 1 0 4 0"/><path d="M17 17a2 2 0 1 0 4 0"/></svg></span>Suppliers</a>

    <a href="mail.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg></span>Mail</a>

    <a href="#" id="logoutLink"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 3v18"/></svg></span>Logout</a>
  </div>

  <div class="main">
    <h1>Activity &amp; Sessions</h1>
    <p style="margin-bottom: 16px; color: var(--text-secondary); font-size: 0.9rem;">
      Recent logins and changes made by users. Only visible to admin.
    </p>

    <div class="table-wrap">
      <table class="clients-table">
        <thead>
          <tr>
            <th>When</th>
            <th>User</th>
            <th>Role</th>
            <th>What happened</th>
          </tr>
        </thead>
        <tbody id="sessionsTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="toast.js"></script>
  <script src="mobile-ui.js"></script>
  <script src="nav-auth.js"></script>
  <script src="session-activity.js"></script>
  <script>
    (function initMobileNav() {
      var overlay = document.getElementById('sidebarOverlay');
      var menuBtn = document.querySelector('.menu-toggle');
      var closeBtn = document.querySelector('.sidebar-close');
      function openSidebar() { document.body.classList.add('sidebar-open'); }
      function closeSidebar() { document.body.classList.remove('sidebar-open'); }
      if (menuBtn) menuBtn.addEventListener('click', openSidebar);
      if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
      if (overlay) overlay.addEventListener('click', closeSidebar);
      document.querySelectorAll('.sidebar a').forEach(function(a) { a.addEventListener('click', closeSidebar); });
    })();

    // Light-only: no theme toggle

    // Auth guard: only allow users with sessions permission
    window.triAuthReady.then(function(user) {
      if (!user) return;
      if (user.role !== 'admin' && !(user.permissions && user.permissions.sessions)) {
        alert('You do not have permission to view sessions.');
        window.location.href = '/index.html';
      } else {
        loadSessions();
      }
    });

    async function loadSessions() {
      try {
        const res = await fetch('/api/sessions');
        if (!res.ok) {
          console.error('Failed to load sessions');
          return;
        }
        const events = await res.json();
        const tbody = document.getElementById('sessionsTableBody');
        tbody.innerHTML = '';
        if (!events.length) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td colspan="4" style="text-align:center;color:var(--text-secondary);padding:16px 0;">No activity yet.</td>';
          tbody.appendChild(tr);
          return;
        }
        events.forEach(function(ev) {
          const tr = document.createElement('tr');
          const createdAt = ev.createdAt ? new Date(ev.createdAt) : null;
          const when = createdAt ? createdAt.toLocaleString() : '';
          const userName = (ev.username || (ev.userId && ev.userId.username) || '—');
          const role = (ev.role || (ev.userId && ev.userId.role) || 'user');
          const summary = (window.TriSessionActivity && TriSessionActivity.formatSessionActivity)
            ? TriSessionActivity.formatSessionActivity(ev)
            : (ev.action || '—');
          tr.innerHTML = `
            <td>${when}</td>
            <td>${userName}</td>
            <td>${role}</td>
            <td>${summary}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error('Error loading sessions:', err);
      }
    }

    (function initLogout() {
      var link = document.getElementById('logoutLink');
      if (!link) return;
      link.addEventListener('click', async function(e) {
        e.preventDefault();
        try {
          await fetch('/logout', { method: 'POST' });
        } catch (_) {}
        window.location.href = '/login.html';
      });
    })();
  </script>
</body>
</html>
