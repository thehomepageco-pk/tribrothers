<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, viewport-fit=cover"/>
  <title>Invoices &amp; Payments | TRI Dashboard</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="responsive.css"/>
  <link rel="stylesheet" href="form-helpers.css"/>
  <style>
    .inv-form-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); margin-bottom: var(--space-4); }
    .inv-form-row > div label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.8125rem; }
    .inv-form-row input, .inv-form-row select, .inv-form-row textarea { width: 100%; box-sizing: border-box; }
    .inv-lines-wrap { margin: 16px 0; overflow-x: auto; }
    .inv-lines-table { width: 100%; border-collapse: collapse; min-width: 760px; }
    .inv-lines-table th, .inv-lines-table td { padding: 8px; border-bottom: 1px solid var(--border-subtle); text-align: left; vertical-align: middle; }
    .inv-lines-table th { font-size: 0.8125rem; color: var(--text-secondary); font-weight: 600; }
    .inv-lines-table td:first-child { min-width: 200px; }
    .inv-lines-table input, .inv-lines-table select { width: 100%; min-width: 80px; box-sizing: border-box; }
    .inv-lines-table .searchable-select-trigger { padding: 10px 32px 10px 12px; font-size: 0.875rem; min-height: 42px; }
    .inv-lines-table .searchable-select-wrap { margin-top: 0; }
    .inv-total-summary { font-size: 0.9375rem; margin: 8px 0 16px; color: var(--text-secondary); }
    .inv-total-summary strong { color: var(--text-primary); }
    .pay-modal-overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: var(--space-4); background: rgba(148, 163, 184, 0.35); z-index: 1000;
    }
    .pay-modal-box {
      background: var(--bg-surface); border: 1px solid var(--border-default);
      border-radius: var(--radius-xl); max-width: 480px; width: 100%;
      box-shadow: var(--shadow-lg); overflow: hidden;
    }
    .pay-modal-header {
      padding: var(--space-5) var(--space-6); border-bottom: 1px solid var(--border-default);
      display: flex; justify-content: space-between; align-items: center;
    }
    .pay-modal-header h2 { margin: 0; font-size: 1.125rem; font-weight: 600; }
    .pay-modal-body { padding: var(--space-6); }
    .pay-modal-body label { display: block; margin: 12px 0 6px; font-weight: 600; font-size: 0.8125rem; }
    .pay-modal-body label:first-child { margin-top: 0; }
    .pay-modal-body input, .pay-modal-body select { width: 100%; box-sizing: border-box; }
    .pay-modal-actions { display: flex; gap: var(--space-3); margin-top: var(--space-5); }
    @media (max-width: 900px) { .inv-form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="app-layout theme-light">
  <button class="menu-toggle" type="button" aria-label="Open menu">
    <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></span>
  </button>
  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>
  <div class="sidebar">
    <button class="sidebar-close" type="button" aria-label="Close menu">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg></span>
    </button>
    <h2>Tri Brothers</h2>
    <small id="navUserBadge" style="display:none;color:var(--text-secondary);font-size:0.75rem;padding:0 16px 8px;"></small>
  </div>

  <div class="main">
    <header class="page-header">
      <h1>Invoices &amp; Payments</h1>
      <button type="button" id="toggleFormBtn" class="btn">New invoice</button>
    </header>

    <div id="invoiceFormWrap" class="form-container is-collapsed">
      <h2 style="margin-bottom:12px;" id="invFormTitle">Create invoice</h2>
      <form id="invoiceForm" novalidate>
        <input type="hidden" id="invEditingId" value="" />

        <div class="inv-form-row">
          <div>
            <label for="client">Client *</label>
            <select id="client">
              <option value="">Select client</option>
            </select>
          </div>
          <div>
            <label for="invoiceNumber">Invoice number *</label>
            <input type="text" id="invoiceNumber" required placeholder="e.g. INV-2026-001" />
          </div>
          <div>
            <label for="status">Status *</label>
            <select id="status" required>
              <option value="Draft">Draft</option>
              <option value="Sent">Sent</option>
              <option value="Partially paid">Partially paid</option>
              <option value="Paid">Paid</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
        </div>

        <div class="inv-form-row">
          <div>
            <label for="invoiceDate">Invoice date *</label>
            <input type="date" id="invoiceDate" required />
          </div>
          <div>
            <label for="dueDate">Due date</label>
            <input type="date" id="dueDate" />
          </div>
          <div>
            <label for="currency">Currency *</label>
            <select id="currency" required></select>
          </div>
        </div>

        <div class="inv-form-row">
          <div>
            <label for="salesContract">Sales contract</label>
            <select id="salesContract">
              <option value="">Select contract (optional)</option>
            </select>
          </div>
          <div>
            <label for="shipment">Shipment</label>
            <select id="shipment">
              <option value="">Select shipment (optional)</option>
            </select>
          </div>
        </div>

        <h3 class="product-form-section-title">Line items</h3>
        <p class="form-hint">Add products, quantities, and unit prices.</p>

        <div class="inv-lines-wrap">
          <table class="inv-lines-table">
            <thead>
              <tr>
                <th>Product</th>
                <th>Description</th>
                <th>Quantity *</th>
                <th>Unit *</th>
                <th>Unit price *</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="invLinesBody"></tbody>
          </table>
        </div>
        <button type="button" class="action-btn" id="invAddLineBtn">+ Add line</button>
        <p class="inv-total-summary" id="invTotalSummary">Invoice total: <strong>—</strong></p>

        <div class="inv-form-row">
          <div style="grid-column: 1 / -1;">
            <label for="notes">Notes</label>
            <textarea id="notes" rows="2" placeholder="Optional notes"></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn" id="invSubmitBtn">Save invoice</button>
          <button type="button" class="action-btn" id="invCancelEditBtn" style="display:none;">Cancel edit</button>
        </div>
      </form>
    </div>

    <div class="products-toolbar" style="margin-top:20px;">
      <div class="toolbar-row">
        <div class="toolbar-group">
          <label for="invSearchInput">Search</label>
          <input type="text" id="invSearchInput" placeholder="Invoice #, client, status…" />
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Invoice #</th>
            <th>Client</th>
            <th>Total</th>
            <th>Paid</th>
            <th>Balance</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="invTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="toast.js"></script>
  <script src="mobile-ui.js"></script>
  <script src="nav-auth.js"></script>
  <script src="form-helpers.js"></script>
  <script>
    (function initMobileNav() {
      var overlay = document.getElementById('sidebarOverlay');
      document.querySelector('.menu-toggle')?.addEventListener('click', function() { document.body.classList.add('sidebar-open'); });
      document.querySelector('.sidebar-close')?.addEventListener('click', function() { document.body.classList.remove('sidebar-open'); });
      overlay?.addEventListener('click', function() { document.body.classList.remove('sidebar-open'); });
      document.querySelectorAll('.sidebar a').forEach(function(a) { a.addEventListener('click', function() { document.body.classList.remove('sidebar-open'); }); });
    })();

    function esc(s) {
      if (s == null) return '';
      var d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function formatDate(iso) {
      if (!iso) return '—';
      var d = new Date(iso);
      return isNaN(d.getTime()) ? '—' : d.toLocaleDateString();
    }

    function toInputDate(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toISOString().slice(0, 10);
    }

    function formatMoney(amount, code) {
      var n = Number(amount);
      if (Number.isNaN(n)) return '—';
      code = code || 'USD';
      try {
        return new Intl.NumberFormat(undefined, { style: 'currency', currency: code }).format(n);
      } catch (_) {
        return code + ' ' + n.toFixed(2);
      }
    }

    function invoiceTotal(inv) {
      if (inv.total != null) return Number(inv.total);
      return (inv.lines || []).reduce(function(s, l) {
        return s + (Number(l.quantity) || 0) * (Number(l.unitPrice) || 0);
      }, 0);
    }

    var allInvoices = [];
    var allClients = [];
    var allProducts = [];
    var allContracts = [];
    var allShipments = [];
    var allCurrencies = [];
    var clientSelectApi = null;
    var currencySelectApi = null;
    var lineCounter = 0;

    function setFormOpen(open) {
      var wrap = document.getElementById('invoiceFormWrap');
      wrap.classList.toggle('is-collapsed', !open);
      document.getElementById('toggleFormBtn').textContent = open ? 'Close form' : 'New invoice';
    }

    function productOptionsHtml(selectedId) {
      return '<option value="">Select product</option>' + allProducts.map(function(p) {
        var sel = selectedId && String(p._id) === String(selectedId) ? ' selected' : '';
        return '<option value="' + esc(p._id) + '"' + sel + '>' + esc(p.name) + (p.hsCode ? ' (' + esc(p.hsCode) + ')' : '') + '</option>';
      }).join('');
    }

    function initLineProductSelect(tr) {
      var sel = tr.querySelector('.inv-line-product');
      if (!sel || sel._searchableSelectApi) return;
      TriForm.initSearchableSelect(sel, {
        placeholder: 'Select product',
        searchPlaceholder: 'Search products…',
        showEmptyOption: true,
      });
    }

    function updateTotalSummary() {
      var code = document.getElementById('currency').value || 'USD';
      var total = 0;
      document.querySelectorAll('#invLinesBody tr').forEach(function(tr) {
        var qty = parseFloat(tr.querySelector('.inv-line-qty').value);
        var price = parseFloat(tr.querySelector('.inv-line-price').value);
        if (!Number.isNaN(qty) && !Number.isNaN(price)) total += qty * price;
      });
      document.getElementById('invTotalSummary').innerHTML = 'Invoice total: <strong>' + formatMoney(total, code) + '</strong>';
    }

    function addLineRow(data) {
      data = data || {};
      lineCounter += 1;
      var tbody = document.getElementById('invLinesBody');
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td><select class="inv-line-product">' + productOptionsHtml(data.productId || (data.product && data.product._id) || data.product) + '</select></td>' +
        '<td><input type="text" class="inv-line-desc" value="' + esc(data.description || '') + '" placeholder="Description" /></td>' +
        '<td><input type="number" class="inv-line-qty" min="0.001" step="any" required value="' + esc(data.quantity != null ? data.quantity : '') + '" /></td>' +
        '<td><select class="inv-line-unit" required><option value="MT"' + ((data.quantityUnit || 'MT') === 'MT' ? ' selected' : '') + '>MT</option><option value="KGS"' + (data.quantityUnit === 'KGS' ? ' selected' : '') + '>KGS</option></select></td>' +
        '<td><input type="number" class="inv-line-price" min="0" step="0.01" required value="' + esc(data.unitPrice != null ? data.unitPrice : '') + '" /></td>' +
        '<td><button type="button" class="action-btn inv-remove-line">Remove</button></td>';
      tbody.appendChild(tr);
      initLineProductSelect(tr);
      tr.querySelector('.inv-line-qty').addEventListener('input', updateTotalSummary);
      tr.querySelector('.inv-line-price').addEventListener('input', updateTotalSummary);
      tr.querySelector('.inv-remove-line').addEventListener('click', function() {
        if (tbody.querySelectorAll('tr').length <= 1) { alert('At least one line is required.'); return; }
        var sel = tr.querySelector('.inv-line-product');
        if (sel && sel._searchableSelectApi) sel._searchableSelectApi.destroy();
        tr.remove();
        updateTotalSummary();
      });
      updateTotalSummary();
    }

    function refreshLineProductSelects() {
      document.querySelectorAll('#invLinesBody tr').forEach(function(tr) {
        var sel = tr.querySelector('.inv-line-product');
        var prev = sel.value;
        sel.innerHTML = productOptionsHtml(prev);
        if (sel._searchableSelectApi) sel._searchableSelectApi.refresh();
        else initLineProductSelect(tr);
      });
    }

    function collectLines() {
      return Array.from(document.querySelectorAll('#invLinesBody tr')).map(function(tr) {
        return {
          productId: tr.querySelector('.inv-line-product').value || undefined,
          description: tr.querySelector('.inv-line-desc').value.trim(),
          quantity: tr.querySelector('.inv-line-qty').value,
          quantityUnit: tr.querySelector('.inv-line-unit').value,
          unitPrice: tr.querySelector('.inv-line-price').value,
        };
      }).filter(function(l) { return l.quantity && l.unitPrice; });
    }

    function rebuildClientSelect(selectedId) {
      var sel = document.getElementById('client');
      var prev = selectedId || sel.value;
      sel.innerHTML = '<option value="">Select client</option>' + allClients.map(function(c) {
        return '<option value="' + esc(c._id) + '">' + esc(c.companyName) + '</option>';
      }).join('');
      if (prev) sel.value = prev;
      if (clientSelectApi) clientSelectApi.refresh();
    }

    function rebuildContractSelect(selectedId) {
      var sel = document.getElementById('salesContract');
      var prev = selectedId || sel.value;
      sel.innerHTML = '<option value="">Select contract (optional)</option>' + allContracts.map(function(c) {
        return '<option value="' + esc(c._id) + '">' + esc(c.contractNumber) + '</option>';
      }).join('');
      if (prev) sel.value = prev;
    }

    function rebuildShipmentSelect(selectedId) {
      var sel = document.getElementById('shipment');
      var prev = selectedId || sel.value;
      sel.innerHTML = '<option value="">Select shipment (optional)</option>' + allShipments.map(function(s) {
        var cn = (s.salesContract && s.salesContract.contractNumber) || '';
        var label = esc(s.shipmentNumber) + (cn ? ' — ' + esc(cn) : '');
        return '<option value="' + esc(s._id) + '">' + label + '</option>';
      }).join('');
      if (prev) sel.value = prev;
    }

    function rebuildCurrencySelect(selectedCode) {
      var sel = document.getElementById('currency');
      var prev = selectedCode || sel.value || 'USD';
      sel.innerHTML = allCurrencies.map(function(c) {
        return '<option value="' + esc(c.code) + '">' + esc(c.code) + ' — ' + esc(c.name) + '</option>';
      }).join('');
      sel.value = prev;
      if (!sel.value && allCurrencies.length) sel.value = 'USD';
      if (currencySelectApi) currencySelectApi.refresh();
      updateTotalSummary();
    }

    async function loadClients() {
      var res = await fetch('/api/clients');
      allClients = res.ok ? await res.json() : [];
      rebuildClientSelect();
    }

    async function loadProducts() {
      var res = await fetch('/api/products');
      allProducts = res.ok ? await res.json() : [];
      allProducts.sort(function(a, b) { return (a.name || '').localeCompare(b.name || ''); });
      refreshLineProductSelects();
    }

    async function loadContracts() {
      var res = await fetch('/api/sales-contracts');
      allContracts = res.ok ? await res.json() : [];
      rebuildContractSelect();
    }

    async function loadShipments() {
      var res = await fetch('/api/shipments');
      allShipments = res.ok ? await res.json() : [];
      rebuildShipmentSelect();
    }

    async function loadCurrencies() {
      var res = await fetch('/api/currencies');
      allCurrencies = res.ok ? await res.json() : [{ code: 'USD', name: 'US Dollar' }];
      rebuildCurrencySelect();
    }

    function suggestInvoiceNumber() {
      var year = new Date().getFullYear();
      var prefix = 'INV-' + year + '-';
      var max = 0;
      allInvoices.forEach(function(inv) {
        var m = String(inv.invoiceNumber || '').match(new RegExp('^' + prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(\\d+)$'));
        if (m) max = Math.max(max, parseInt(m[1], 10));
      });
      return prefix + String(max + 1).padStart(3, '0');
    }

    function resetForm() {
      document.getElementById('invEditingId').value = '';
      document.getElementById('invoiceForm').reset();
      document.getElementById('invoiceDate').value = new Date().toISOString().slice(0, 10);
      document.getElementById('invoiceNumber').value = suggestInvoiceNumber();
      document.getElementById('status').value = 'Draft';
      document.getElementById('invLinesBody').innerHTML = '';
      lineCounter = 0;
      addLineRow();
      document.getElementById('invFormTitle').textContent = 'Create invoice';
      document.getElementById('invSubmitBtn').textContent = 'Save invoice';
      document.getElementById('invCancelEditBtn').style.display = 'none';
      rebuildCurrencySelect('USD');
      if (clientSelectApi) clientSelectApi.setValue('');
    }

    function getFilteredInvoices() {
      var q = (document.getElementById('invSearchInput').value || '').trim().toLowerCase();
      if (!q) return allInvoices;
      return allInvoices.filter(function(inv) {
        var client = (inv.client && inv.client.companyName) || '';
        return (inv.invoiceNumber || '').toLowerCase().includes(q)
          || client.toLowerCase().includes(q)
          || (inv.status || '').toLowerCase().includes(q);
      });
    }

    function renderTable() {
      var list = getFilteredInvoices();
      var tbody = document.getElementById('invTableBody');
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:16px;color:var(--text-secondary);">No invoices yet.</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(function(inv) {
        var cur = inv.currency || 'USD';
        var total = invoiceTotal(inv);
        var paid = inv.paidAmount != null ? Number(inv.paidAmount) : 0;
        var balance = inv.balance != null ? Number(inv.balance) : Math.max(0, total - paid);
        var clientName = (inv.client && inv.client.companyName) || '—';
        return '<tr>' +
          '<td class="cell-nowrap">' + esc(inv.invoiceNumber) + '</td>' +
          '<td>' + esc(clientName) + '</td>' +
          '<td class="cell-nowrap">' + esc(formatMoney(total, cur)) + '</td>' +
          '<td class="cell-nowrap">' + esc(formatMoney(paid, cur)) + '</td>' +
          '<td class="cell-nowrap">' + esc(formatMoney(balance, cur)) + '</td>' +
          '<td class="cell-nowrap">' + esc(inv.status || 'Draft') + '</td>' +
          '<td class="cell-actions">' +
            '<button type="button" class="action-btn inv-print-btn" data-id="' + esc(inv._id) + '">Print</button> ' +
            '<button type="button" class="action-btn inv-edit-btn" data-id="' + esc(inv._id) + '">Edit</button> ' +
            '<button type="button" class="action-btn inv-pay-btn" data-id="' + esc(inv._id) + '" data-balance="' + esc(balance) + '" data-currency="' + esc(cur) + '">Record payment</button> ' +
            '<button type="button" class="action-btn inv-delete-btn" data-id="' + esc(inv._id) + '">Delete</button>' +
          '</td></tr>';
      }).join('');

      tbody.querySelectorAll('.inv-print-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          window.open('/api/invoices/' + btn.getAttribute('data-id') + '/print', '_blank');
        });
      });
      tbody.querySelectorAll('.inv-edit-btn').forEach(function(btn) {
        btn.addEventListener('click', function() { openEdit(btn.getAttribute('data-id')); });
      });
      tbody.querySelectorAll('.inv-pay-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          openPaymentModal(btn.getAttribute('data-id'), btn.getAttribute('data-balance'), btn.getAttribute('data-currency'));
        });
      });
      tbody.querySelectorAll('.inv-delete-btn').forEach(function(btn) {
        btn.addEventListener('click', function() { deleteInvoice(btn.getAttribute('data-id')); });
      });
    }

    async function loadInvoices() {
      var res = await fetch('/api/invoices');
      allInvoices = res.ok ? await res.json() : [];
      renderTable();
    }

    function prefillFromShipment(shipmentId) {
      var s = allShipments.find(function(x) { return String(x._id) === String(shipmentId); });
      if (!s) return;
      rebuildShipmentSelect(shipmentId);
      document.getElementById('shipment').value = shipmentId;
      var scId = (s.salesContract && s.salesContract._id) ? s.salesContract._id : s.salesContract;
      if (scId) {
        rebuildContractSelect(scId);
        document.getElementById('salesContract').value = scId;
      }
      if (s.shipmentType) document.getElementById('notes').value = 'Shipment ' + (s.shipmentNumber || '') + (s.vesselName ? ' — ' + s.vesselName : '');
    }

    async function openEdit(id) {
      var res = await fetch('/api/invoices/' + encodeURIComponent(id));
      var inv = await res.json();
      if (!res.ok) { alert(inv.error || 'Failed to load invoice'); return; }

      document.getElementById('invEditingId').value = inv._id;
      var clientId = (inv.client && inv.client._id) ? inv.client._id : inv.client;
      rebuildClientSelect(clientId);
      if (clientSelectApi) clientSelectApi.setValue(clientId || '');

      document.getElementById('invoiceNumber').value = inv.invoiceNumber || '';
      document.getElementById('invoiceDate').value = toInputDate(inv.invoiceDate);
      document.getElementById('dueDate').value = toInputDate(inv.dueDate);
      rebuildCurrencySelect(inv.currency || 'USD');
      document.getElementById('status').value = inv.status || 'Draft';
      document.getElementById('notes').value = inv.notes || '';

      var scId = (inv.salesContract && inv.salesContract._id) ? inv.salesContract._id : inv.salesContract;
      var shId = (inv.shipment && inv.shipment._id) ? inv.shipment._id : inv.shipment;
      rebuildContractSelect(scId);
      rebuildShipmentSelect(shId);
      document.getElementById('salesContract').value = scId || '';
      document.getElementById('shipment').value = shId || '';

      document.getElementById('invLinesBody').innerHTML = '';
      lineCounter = 0;
      var lines = inv.lines || [];
      if (!lines.length) addLineRow();
      else lines.forEach(function(l) {
        addLineRow({
          product: l.product,
          productId: l.product && l.product._id ? l.product._id : l.product,
          description: l.description,
          quantity: l.quantity,
          quantityUnit: l.quantityUnit,
          unitPrice: l.unitPrice,
        });
      });

      document.getElementById('invFormTitle').textContent = 'Edit invoice';
      document.getElementById('invSubmitBtn').textContent = 'Save changes';
      document.getElementById('invCancelEditBtn').style.display = '';
      setFormOpen(true);
      document.getElementById('invoiceFormWrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    async function deleteInvoice(id) {
      if (!confirm('Delete this invoice?')) return;
      var res = await fetch('/api/invoices/' + encodeURIComponent(id), { method: 'DELETE' });
      var r = await res.json();
      if (!res.ok) { alert(r.error || 'Delete failed'); return; }
      if (document.getElementById('invEditingId').value === id) {
        resetForm();
        setFormOpen(false);
      }
      loadInvoices();
      if (window.triToast) triToast('Invoice deleted', 'success');
    }

    function openPaymentModal(invoiceId, balance, currency) {
      var existing = document.getElementById('paymentModal');
      if (existing) existing.remove();

      var modal = document.createElement('div');
      modal.id = 'paymentModal';
      modal.className = 'pay-modal-overlay';
      modal.innerHTML =
        '<div class="pay-modal-box" role="dialog" aria-labelledby="payModalTitle">' +
          '<div class="pay-modal-header">' +
            '<h2 id="payModalTitle">Record payment</h2>' +
            '<button type="button" class="action-btn" id="payModalClose">Close</button>' +
          '</div>' +
          '<div class="pay-modal-body">' +
            '<p class="form-hint">Outstanding balance: <strong>' + esc(formatMoney(balance, currency)) + '</strong></p>' +
            '<label for="payAmount">Amount *</label>' +
            '<input type="number" id="payAmount" min="0.01" step="0.01" required value="' + esc(Number(balance) > 0 ? balance : '') + '" />' +
            '<label for="payDate">Payment date *</label>' +
            '<input type="date" id="payDate" required value="' + esc(new Date().toISOString().slice(0, 10)) + '" />' +
            '<label for="payMethod">Method *</label>' +
            '<select id="payMethod" required>' +
              '<option value="TT">TT</option>' +
              '<option value="Cash">Cash</option>' +
              '<option value="Cheque">Cheque</option>' +
              '<option value="LC">LC</option>' +
              '<option value="Other">Other</option>' +
            '</select>' +
            '<label for="payReference">Reference</label>' +
            '<input type="text" id="payReference" placeholder="Transaction / cheque ref" />' +
            '<div class="pay-modal-actions">' +
              '<button type="button" class="btn" id="paySubmitBtn">Save payment</button>' +
              '<button type="button" class="action-btn" id="payCancelBtn">Cancel</button>' +
            '</div>' +
          '</div>' +
        '</div>';

      document.body.appendChild(modal);

      function closeModal() { modal.remove(); }
      modal.querySelector('#payModalClose').addEventListener('click', closeModal);
      modal.querySelector('#payCancelBtn').addEventListener('click', closeModal);
      modal.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });

      modal.querySelector('#paySubmitBtn').addEventListener('click', async function() {
        var amount = parseFloat(document.getElementById('payAmount').value);
        var paymentDate = document.getElementById('payDate').value;
        var method = document.getElementById('payMethod').value;
        var reference = document.getElementById('payReference').value.trim();
        if (!amount || amount <= 0) { alert('Enter a valid payment amount.'); return; }
        if (!paymentDate) { alert('Select a payment date.'); return; }

        var res = await fetch('/api/invoices/' + encodeURIComponent(invoiceId) + '/payments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: amount, paymentDate: paymentDate, method: method, reference: reference }),
        });
        var result = await res.json();
        if (!res.ok) { alert(result.error || 'Payment failed'); return; }
        closeModal();
        loadInvoices();
        if (window.triToast) triToast('Payment recorded', 'success');
      });
    }

    document.getElementById('toggleFormBtn').addEventListener('click', function() {
      var wrap = document.getElementById('invoiceFormWrap');
      var isCollapsed = wrap.classList.contains('is-collapsed');
      if (isCollapsed && document.getElementById('invEditingId').value) resetForm();
      setFormOpen(isCollapsed);
    });

    document.getElementById('invCancelEditBtn').addEventListener('click', function() {
      resetForm();
      setFormOpen(false);
    });

    document.getElementById('invAddLineBtn').addEventListener('click', function() { addLineRow(); });
    document.getElementById('invSearchInput').addEventListener('input', renderTable);
    document.getElementById('currency').addEventListener('change', updateTotalSummary);

    document.getElementById('invoiceForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var lines = collectLines();
      if (!lines.length) { alert('Add at least one line with quantity and unit price.'); return; }

      var payload = {
        client: (clientSelectApi && clientSelectApi.getValue()) || document.getElementById('client').value,
        invoiceNumber: document.getElementById('invoiceNumber').value.trim(),
        invoiceDate: document.getElementById('invoiceDate').value,
        dueDate: document.getElementById('dueDate').value || undefined,
        currency: (currencySelectApi && currencySelectApi.getValue()) || document.getElementById('currency').value,
        status: document.getElementById('status').value,
        salesContract: document.getElementById('salesContract').value || undefined,
        shipment: document.getElementById('shipment').value || undefined,
        notes: document.getElementById('notes').value.trim(),
        lines: lines.map(function(l) {
          return {
            product: l.productId || undefined,
            description: l.description,
            quantity: Number(l.quantity),
            quantityUnit: l.quantityUnit,
            unitPrice: Number(l.unitPrice),
          };
        }),
      };

      if (!payload.client) { alert('Select a client.'); return; }
      if (!payload.invoiceNumber) { alert('Enter an invoice number.'); return; }
      if (!payload.invoiceDate) { alert('Select an invoice date.'); return; }

      var editingId = document.getElementById('invEditingId').value;
      var url = editingId ? '/api/invoices/' + editingId : '/api/invoices';
      var res = await fetch(url, {
        method: editingId ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      var result = await res.json();
      if (!res.ok) { alert(result.error || 'Save failed'); return; }

      resetForm();
      setFormOpen(false);
      loadInvoices();
      if (window.triToast) triToast(editingId ? 'Invoice updated' : 'Invoice saved', 'success');
    });

    window.triAuthReady.then(async function(user) {
      if (!user) return;

      clientSelectApi = TriForm.initSearchableSelect(document.getElementById('client'), {
        placeholder: 'Select client',
        searchPlaceholder: 'Search clients…',
        showEmptyOption: true,
      });
      currencySelectApi = TriForm.initSearchableSelect(document.getElementById('currency'), {
        placeholder: 'Select currency',
        searchPlaceholder: 'Search currency…',
      });

      document.getElementById('invoiceDate').value = new Date().toISOString().slice(0, 10);
      addLineRow();

      await Promise.all([loadClients(), loadProducts(), loadContracts(), loadShipments(), loadCurrencies()]);
      await loadInvoices();
      if (!document.getElementById('invoiceNumber').value) {
        document.getElementById('invoiceNumber').value = suggestInvoiceNumber();
      }

      var params = new URLSearchParams(window.location.search);
      if (params.get('new') === '1') {
        document.getElementById('invoiceNumber').value = suggestInvoiceNumber();
        setFormOpen(true);
      }

      var shipmentId = params.get('shipment');
      if (shipmentId) {
        prefillFromShipment(shipmentId);
        setFormOpen(true);
      }

      var clientId = params.get('client');
      if (clientId) {
        rebuildClientSelect(clientId);
        if (clientSelectApi) clientSelectApi.setValue(clientId);
        setFormOpen(true);
      }
    });

    document.getElementById('logoutLink')?.addEventListener('click', async function(e) {
      e.preventDefault();
      try { await fetch('/logout', { method: 'POST' }); } catch (_) {}
      window.location.href = '/login.html';
    });
  </script>
</body>
</html>
