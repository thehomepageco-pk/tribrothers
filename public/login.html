<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Sign in — Tri Brothers</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="responsive.css"/>
</head>
<body class="login-page theme-light">
  <div class="login-atmosphere" aria-hidden="true"></div>

  <main class="login-shell">
    <div class="login-card">
      <header class="login-header">
        <img
          class="login-logo-img"
          src="/img/tri-logo.png"
          alt="Tri Brothers"
          width="220"
          height="220"
          decoding="async"
        />
        <h1 class="login-title">Sign in</h1>
        <p class="login-subtitle">Access your quotations, contracts, and reports.</p>
      </header>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="login-label" for="username">Username</label>
          <div class="login-input-wrap">
            <span class="form-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M20 21a8 8 0 1 0-16 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 13a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Z" stroke="currentColor" stroke-width="1.6"/></svg>
            </span>
            <input
              type="text"
              name="username"
              id="username"
              placeholder="Enter your username"
              required
              autocomplete="username"
              autofocus
              spellcheck="false"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="login-label" for="password">Password</label>
          <div class="login-input-wrap">
            <span class="form-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M7 11V8a5 5 0 0 1 10 0v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M7 11h10a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6"/></svg>
            </span>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
            <button type="button" class="login-toggle-pass" id="togglePassword" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>

        <div id="errorMessage" class="error-message" role="alert" aria-live="polite"></div>

        <button type="submit" class="btn login-button" id="loginSubmitBtn">
          <span class="login-btn-label">Sign in</span>
        </button>
      </form>

      <p class="login-footer-hint">Need access? Ask your admin to create an account.</p>
    </div>
  </main>

  <script>
    fetch('/api/auth/check')
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.authenticated) window.location.href = '/index.html';
      })
      .catch(function() {});

    (function initPasswordToggle() {
      var btn = document.getElementById('togglePassword');
      var input = document.getElementById('password');
      if (!btn || !input) return;
      btn.addEventListener('click', function() {
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.textContent = show ? 'Hide' : 'Show';
        btn.setAttribute('aria-pressed', show ? 'true' : 'false');
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      });
    })();

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      var errorDiv = document.getElementById('errorMessage');
      var submitBtn = document.getElementById('loginSubmitBtn');
      var label = submitBtn.querySelector('.login-btn-label');

      errorDiv.classList.remove('show');
      errorDiv.textContent = '';

      if (!username || !password) {
        errorDiv.textContent = 'Enter both username and password.';
        errorDiv.classList.add('show');
        return;
      }

      submitBtn.disabled = true;
      label.textContent = 'Signing in…';

      try {
        var response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        });
        var result = await response.json();

        if (result.success) {
          label.textContent = 'Welcome…';
          window.location.href = result.redirect || '/index.html';
          return;
        }

        errorDiv.textContent = result.error || 'Invalid username or password.';
        errorDiv.classList.add('show');
        submitBtn.disabled = false;
        label.textContent = 'Sign in';
        document.getElementById('password').focus();
      } catch (err) {
        errorDiv.textContent = 'Could not reach the server. Check your connection and try again.';
        errorDiv.classList.add('show');
        submitBtn.disabled = false;
        label.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
